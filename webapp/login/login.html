<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Design by foolishdeveloper.com -->
    <title>Login page</title>
 
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">

</head>
<body>
    <div class="background">
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    <form action="http://localhost:5000/auth/login/" method="post">
        <h3>Login</h3>

        <label for="email">Email</label>
        <input type="text" placeholder="Email" id="email">

        <label for="password">Password</label>
        <div style="position: relative;">
        <input type="password" placeholder="Password" id="password" style="padding-right: 40px;">
        <button type="button" id="togglePassword"><i class="fas fa-eye"></i></button>
        </div>
        <button>Log In</button>
    </form>
    <!-- utils scripts -->
    <script src="../utils/cookies.js"></script>
    <script src="../utils/api.js"></script>

    <script src="login.js"></script>
</body>
</html>
